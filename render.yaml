services:
  # ── Backend (FastAPI) ──────────────────────────────────────────────
  - type: web
    name: medease-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false                     # set manually in Render dashboard
      - key: FRONTEND_URL
        sync: false                     # e.g. https://medease-frontend.onrender.com
      - key: PYTHON_VERSION
        value: 3.11.6
    healthCheckPath: /

  # ── Frontend (Vite / React static site) ────────────────────────────
  - type: web
    name: medease-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false                     # e.g. https://medease-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
